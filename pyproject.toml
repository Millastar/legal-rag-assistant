[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "legal-rag-assistant"
version = "1.0.0"
description = "A source-grounded Chinese labor-law assistant using dense retrieval and cross-encoder reranking."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "chromadb==1.5.9",
  "llama-index-core==0.14.23",
  "llama-index-embeddings-huggingface==0.7.0",
  "llama-index-llms-openai-like==0.7.2",
  "llama-index-vector-stores-chroma==0.5.5",
  "python-dotenv==1.2.2",
  "sentence-transformers==2.7.0",
  "streamlit==1.61.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/legal_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

